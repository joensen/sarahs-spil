  <!-- Toilet seat -->
  <ellipse cx="50" cy="55" rx="28" ry="18" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <ellipse cx="50" cy="55" rx="20" ry="12" fill="#e3f2fd"/>

