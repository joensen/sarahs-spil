<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#fff8e1"/>

  <!-- Header bar -->
  <rect width="400" height="40" fill="#7c4dff"/>
  <text x="20" y="28" font-family="Arial" font-size="20" font-weight="bold" fill="white">Toiletterne</text>

  <!-- Girl character (top right) -->
  <circle cx="330" cy="80" r="20" fill="#ec407a" stroke="#c2185b" stroke-width="2"/>
  <text x="330" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Pige</text>

  <!-- Boy character (top left) -->
  <circle cx="70" cy="80" r="20" fill="#1e88e5" stroke="#1565c0" stroke-width="2"/>
  <text x="70" y="115" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Dreng</text>

  <!-- Girl toilet (bottom left) -->
  <rect x="50" y="200" width="40" height="50" rx="5" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="50" y="195" width="40" height="8" rx="2" fill="#f48fb1"/>
  <text x="70" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#ec407a">Pige</text>

  <!-- Boy toilet (bottom right) -->
  <rect x="310" y="200" width="40" height="50" rx="5" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2"/>
  <rect x="310" y="195" width="40" height="8" rx="2" fill="#64b5f6"/>
  <text x="330" y="270" font-family="Arial" font-size="10" text-anchor="middle" fill="#1e88e5">Dreng</text>

  <!-- Path lines (crossing) -->
  <path d="M330 80 Q200 150 70 225" stroke="#ec407a" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <path d="M70 80 Q200 150 330 225" stroke="#1e88e5" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
</svg>
